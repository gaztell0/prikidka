name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# Serialize the whole workflow so a queued run chooses the latest tested SHAs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build production and development site
    if: >-
      ${{
        github.repository == 'gaztell0/prikidka' &&
        github.ref == 'refs/heads/main' &&
        (
          (
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_repository.full_name == github.repository &&
            contains(fromJSON('["main", "dev"]'), github.event.workflow_run.head_branch)
          ) || github.event_name == 'workflow_dispatch'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      prepare: ${{ steps.prepare.outputs.prepare }}
      main_sha: ${{ steps.prepare.outputs.main_sha }}
      dev_sha: ${{ steps.prepare.outputs.dev_sha }}
    steps:
      - name: Checkout trusted build tools from the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: tools
          persist-credentials: false
      - name: Select the latest successful CI push for each branch
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          successful_ci_sha() {
            local branch="$1"
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              --field branch="$branch" \
              --field event=push \
              --field status=success \
              --field per_page=100 \
              | jq -r --arg branch "$branch" --arg repo "$GITHUB_REPOSITORY" '
                  .workflow_runs
                  | map(select(
                      .head_branch == $branch
                      and .head_repository.full_name == $repo
                      and .event == "push"
                      and .status == "completed"
                      and .conclusion == "success"
                      and (.head_sha | type == "string")
                      and (.head_sha | tostring | test("^[0-9a-f]{40}$"))
                    ))
                  | max_by(.run_number)
                  | .head_sha // empty
                '
          }
          main_sha="$(successful_ci_sha main)"
          dev_sha="$(successful_ci_sha dev)"
          if [[ ! "$main_sha" =~ ^[0-9a-f]{40}$ || ! "$dev_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'prepare=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Pages deployment skipped: main and dev must each have a successful CI push run. Existing site is unchanged.'
            exit 0
          fi
          {
            echo 'prepare=true'
            echo "main_sha=$main_sha"
            echo "dev_sha=$dev_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout tested production files
        if: steps.prepare.outputs.prepare == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.prepare.outputs.main_sha }}
          path: prod-source
          persist-credentials: false
      - name: Checkout tested development files
        if: steps.prepare.outputs.prepare == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.prepare.outputs.dev_sha }}
          path: dev-source
          persist-credentials: false
      - name: Set up Node.js LTS
        if: steps.prepare.outputs.prepare == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build both versions with trusted tools
        if: steps.prepare.outputs.prepare == 'true'
        env:
          PROD_SHA: ${{ steps.prepare.outputs.main_sha }}
          DEV_SHA: ${{ steps.prepare.outputs.dev_sha }}
        run: |
          node tools/scripts/build-pages.mjs --prod prod-source --dev dev-source --output _site \
            --prod-sha "$PROD_SHA" --dev-sha "$DEV_SHA"
      - name: Upload the combined Pages site
        if: steps.prepare.outputs.prepare == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

  deploy:
    name: Deploy combined Pages site
    needs: build
    if: needs.build.outputs.prepare == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
